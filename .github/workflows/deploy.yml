name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 与本地构建时区保持一致，避免零点日期在 UTC 下回退一天
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 一步装好 pnpm + Node 24，并缓存 pnpm store（替代 pnpm/action-setup + actions/setup-node）
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@24
          cache: true
          # 等价于 pnpm install --frozen-lockfile，且 lockfile 缺失时直接失败
          require-lockfile: true

      - name: Generate site
        run: pnpm hexo generate

      - name: Deploy to GeoDaoyu.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: GeoDaoyu/GeoDaoyu.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
          user_name: GeoDaoyu
          user_email: 34641603+GeoDaoyu@users.noreply.github.com
